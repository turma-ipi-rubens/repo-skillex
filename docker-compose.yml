# =============================================================================
#  SkillEx — Docker Compose
# =============================================================================
#  Uso rápido:
#    cp .env.example .env         # ajuste JWT_SECRET antes de subir em produção
#    docker compose up --build    # build + start
#    docker compose up -d         # start em segundo plano
#    docker compose down -v       # encerra e remove volumes (apaga dados!)
# =============================================================================

services:

  # ─── Backend (API Express + Prisma + SQLite) ───────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Banco SQLite persistido no volume skillex_data
      DATABASE_URL: file:/app/data/skillex.db
      # Segredo JWT — sobrescreva com variável de ambiente ou arquivo .env
      JWT_SECRET: ${JWT_SECRET:-skillex-docker-secret-CHANGE-ME}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PORT: 3333
      # Uploads persistidos no volume skillex_uploads
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-5}
      # URL do frontend (usada no header CORS) — sempre o IP da máquina,
      # preenchido por scripts/setup-env.cjs antes do `docker compose up`.
      CLIENT_URL: "${CLIENT_URL:?defina CLIENT_URL no .env (rode node scripts/setup-env.cjs)}"
      # Jitsi self-hosted (necessário para o endpoint /requests/:id/video-token)
      JITSI_DOMAIN: "${JITSI_DOMAIN:?defina JITSI_DOMAIN no .env (rode node scripts/setup-env.cjs)}"
      JITSI_APP_ID: ${JITSI_APP_ID:-skillex}
      JITSI_APP_SECRET: ${JITSI_APP_SECRET:-}
    volumes:
      - skillex_data:/app/data
      - skillex_uploads:/app/uploads
    ports:
      - "3333:3333"
    healthcheck:
      # Loopback (127.0.0.1) é o único endereço alcançável de dentro do
      # próprio container — não é coupling de host, é o backend conversando
      # consigo mesmo. Por isso permanece "127.0.0.1" aqui.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3333/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── Frontend (Vite build → nginx) ────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

# ─── Volumes persistentes ─────────────────────────────────────────────────────
volumes:
  skillex_data:
    driver: local
  skillex_uploads:
    driver: local
